# Example only. Do not commit the real value.
# Copy to turn-secret.local.yaml (ignored by git), fill in the secret, then:
#   kubectl apply -f jitsi/turn-secret.local.yaml
# Or simply:
#   kubectl -n jitsi create secret generic jitsi-turn --from-literal=TURN_CREDENTIALS='<TURN_SHARED_SECRET>'
apiVersion: v1
kind: Secret
metadata:
  name: jitsi-turn
  namespace: jitsi
type: Opaque
stringData:
  TURN_CREDENTIALS: "<TURN_SHARED_SECRET>"   # must equal sharedSecret in stunner/gatewayconfig.yaml
